  <aside class="profile-sidebar">
    <div class="user-card-mini">
      <div class="avatar-circle">
        {{ userInitials() }}
      </div>
      <div class="user-meta">
        <h3>{{ user()?.firstName || 'Mi cuenta' }} {{ user()?.lastName || '' }}</h3>
        <span class="user-badge">Cliente</span>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Mi cuenta">
      <a routerLink="/perfil" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Mi Perfil</span>
      </a>

      <a routerLink="/transacciones" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
        <span>Transacciones</span>
      </a>

      <a routerLink="/notificaciones" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4"/></svg>
        <span>Notificaciones</span>
      </a>
      <a routerLink="/" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Página Principal</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="logout-btn" (click)="onLogout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>
