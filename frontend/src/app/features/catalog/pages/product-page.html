<main class="product-page">
  <img class="product-page__bg" src="/images/stadium.jpg" alt="" />
  <div class="product-page__overlay"></div>

  <div class="product-page__content">
    <a routerLink="/catalogo" class="product-page__back">← Volver al catálogo</a>

    @if (product(); as item) {
      <article class="product-detail">
        <div
          class="product-detail__kit"
          [style.--accent]="item.accent"
          [style.--stripe]="item.stripe"
        ></div>
        <div class="product-detail__info">
          <p class="product-detail__category">{{ item.category }}</p>
          <h1>{{ item.name }}</h1>
          <p class="product-detail__price">{{ priceLabel(item.price) }}</p>
          <p class="product-detail__desc">{{ item.description }}</p>
          <div class="product-detail__actions">
            <button type="button" (click)="addToCart()">Añadir al carrito</button>
            <a [routerLink]="['/personalizar', item.id]" class="product-detail__customize">✦ Personalizar</a>
            <a routerLink="/carrito">Ir al carrito</a>
          </div>
        </div>
      </article>
    } @else {
      <p class="product-page__empty">No encontramos esa camiseta.</p>
    }
  </div>
</main>
