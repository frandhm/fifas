<div class="public-shell">
  <header class="public-header">
    <a routerLink="/" class="public-header__brand">
      <img src="/images/logo.png" alt="" />
      <span>Los FIFAS</span>
    </a>

    <nav class="public-header__nav" aria-label="Principal">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/catalogo" routerLinkActive="is-active">Camisetas</a>
      <a routerLink="/personalizar" routerLinkActive="is-active">Personalizar</a>
    </nav>

    <div class="public-header__actions">
      <a routerLink="/perfil" aria-label="Perfil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8" r="3.2" />
          <path d="M5 19.2c.8-3.2 3.5-5.2 7-5.2s6.2 2 7 5.2" />
        </svg>
      </a>
      <a routerLink="/carrito" aria-label="Carrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M6 7h15l-1.5 8.5H8L6 7Z" />
          <path d="M6 7 5 4H2" />
          <circle cx="9" cy="20" r="1.3" />
          <circle cx="18" cy="20" r="1.3" />
        </svg>
      </a>
    </div>
  </header>

  <div class="public-shell__content">
    <router-outlet />
  </div>

  <footer class="public-footer">
    <div class="public-footer__grid">
      <div>
        <h2>Enlaces rápidos</h2>
        <a routerLink="/">Inicio</a>
        <a routerLink="/catalogo">Camisetas</a>
        <a routerLink="/personalizar">Personalizar</a>
      </div>
      <div>
        <h2>Atención al cliente</h2>
        <a routerLink="/carrito">Carrito</a>
        <a routerLink="/perfil">Perfil</a>
        <a routerLink="/transacciones">Transacciones</a>
      </div>
      <div>
        <h2>Los FIFAS</h2>
        <p>Camisetas oficiales y personalizadas.</p>
      </div>
    </div>
    <p class="public-footer__copy">© 2026 LOS FIFAS — Todos los derechos reservados.</p>
  </footer>
</div>
